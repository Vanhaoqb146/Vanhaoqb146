<svg width="100%" height="100%" viewBox="0 0 950 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orbCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#4364F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6FB1FC" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0052D4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .terminal-dot { transition: all 0.3s ease; }
    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: 5px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 3px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Card Background with rounded corners -->
  <rect width="950" height="260" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <rect width="950" height="260" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="80" r="220" fill="url(#orbCyan)"/>
  <circle cx="800" cy="100" r="260" fill="url(#orbPurple)"/>

  <!-- Top Terminal Bar -->
  <circle cx="35" cy="30" r="6" fill="#FF5F56" class="terminal-dot"/>
  <circle cx="55" cy="30" r="6" fill="#FFBD2E" class="terminal-dot"/>
  <circle cx="75" cy="30" r="6" fill="#27C93F" class="terminal-dot"/>
  <text x="105" y="34" fill="#475569" font-family="'Fira Code', monospace" font-size="12" font-weight="600">~/vanhaoqb146/profile/portfolio.sh</text>

  <!-- Center Decorative Glow Line -->
  <line x1="120" y1="55" x2="830" y2="55" stroke="#1E293B" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Main Name: VĂN HÀO -->
  <g id="main-title">
    <!-- Subtle drop shadow -->
    <text x="475" y="125" text-anchor="middle" fill="#003B73" class="title-text" opacity="0.6">VĂN HÀO</text>
    <text x="473" y="123" text-anchor="middle" fill="url(#textGrad)" class="title-text">VĂN HÀO</text>
  </g>

  <!-- Subtitle -->
  <text x="475" y="158" text-anchor="middle" class="subtitle-text">SOFTWARE DEVELOPER  •  AI &amp; AUTOMATION SPECIALIST</text>

  <!-- Feature Pills -->
  <g transform="translate(245, 178)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="26" rx="13" fill="#1E293B" stroke="#00D2FF" stroke-width="1" fill-opacity="0.8"/>
    <text x="67" y="17" text-anchor="middle" fill="#00F2FE" class="badge-text">👁️ Computer Vision</text>

    <!-- Pill 2 -->
    <rect x="150" y="0" width="150" height="26" rx="13" fill="#1E293B" stroke="#7928CA" stroke-width="1" fill-opacity="0.8"/>
    <text x="225" y="17" text-anchor="middle" fill="#D8B4FE" class="badge-text">⚡ Automation Tools</text>

    <!-- Pill 3 -->
    <rect x="315" y="0" width="145" height="26" rx="13" fill="#1E293B" stroke="#10B981" stroke-width="1" fill-opacity="0.8"/>
    <text x="387" y="17" text-anchor="middle" fill="#6EE7B7" class="badge-text">🌐 Web Architecture</text>
  </g>

  <!-- Modern Wave Curves at bottom -->
  <path d="M0,235 C180,210 320,250 500,230 C680,210 820,245 950,230 L950,260 L0,260 Z" fill="url(#waveGrad1)"/>
  <path d="M0,245 C200,230 360,255 540,240 C720,225 840,250 950,245 L950,260 L0,260 Z" fill="url(#waveGrad2)"/>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="948" height="258" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
</svg>
